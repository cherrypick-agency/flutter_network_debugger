[package]
name = "add_header"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Для компиляции в WASM:
# cargo build --target wasm32-unknown-unknown --release
# Результат: target/wasm32-unknown-unknown/release/add_header.wasm
