name: firebase_database_debugger
description: "Helper package to send Firebase Realtime Database operations to network-debugger ingest API."
version: 0.1.0
repository: https://github.com/cherrypick-agency/flutter_network_debugger
homepage: https://github.com/cherrypick-agency/flutter_network_debugger
issue_tracker: https://github.com/cherrypick-agency/flutter_network_debugger/issues
topics:
  - firebase
  - realtime-database
  - debug
  - network
  - proxy

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_database: ^11.1.6
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  nd_test_support:
    path: ../nd_test_support
