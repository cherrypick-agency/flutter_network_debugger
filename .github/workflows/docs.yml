name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "dart_packages/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "dart_packages/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dartdoc_vitepress
        run: dart pub global activate --source git https://github.com/777genius/dartdoc_vitepress.git

      - name: Generate docs-site
        working-directory: dart_packages
        run: >
          dart pub global run dartdoc_vitepress
          --format vitepress
          --workspace-docs
          --exclude-packages 'nd_e2e_tests,nd_e2e_tests_flutter,nd_test_support'
          --output ../docs-site-generated

      - name: Apply docs-site template
        run: |
          mkdir -p docs-site-generated/.vitepress/generated docs-site-generated/guide
          cp docs-site/index.md docs-site-generated/index.md
          cp docs-site/guide/*.md docs-site-generated/guide/
          cp docs-site/package.json docs-site-generated/package.json
          cp docs-site/.vitepress/config.ts docs-site-generated/.vitepress/config.ts
          rm -rf docs-site-generated/.vitepress/theme
          cp -R docs-site/.vitepress/theme docs-site-generated/.vitepress/theme
          if [ -d docs-site/public ]; then
            cp -R docs-site/public docs-site-generated/public
          fi

      - name: Install docs-site dependencies
        working-directory: docs-site-generated
        run: npm install

      - name: Build docs-site
        working-directory: docs-site-generated
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site-generated/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
