name: coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Create placeholder _web directories
        run: |
          mkdir -p cmd/network-debugger-web/_web cmd/wsapp/_web
          touch cmd/network-debugger-web/_web/.gitkeep cmd/wsapp/_web/.gitkeep

      - name: Run tests with coverage
        run: |
          go version
          # Run tests excluding integration and e2e tests which have flaky timing issues in CI
          go test -covermode=atomic -coverprofile=coverage.out $(go list ./... | grep -v /internal/integration | grep -v /internal/e2e)

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

