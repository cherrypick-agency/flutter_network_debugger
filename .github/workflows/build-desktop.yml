name: Desktop Builds

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths:
      - 'frontend/**'
      - 'cmd/network-debugger/**'
      - 'cmd/network-debugger-web/**'
      - 'internal/**'
      - 'scripts/package-*.sh'
      - 'scripts/package-*.ps1'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel  # Free Intel runner for public repos (supported until Aug 2027)
          - arch: arm64
            runner: macos-latest  # Apple Silicon runner
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            frontend/.dart_tool
          key: ${{ runner.os }}-${{ matrix.arch }}-flutter-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-flutter-

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-${{ matrix.arch }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-go-

      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get

      - name: Enable macOS desktop
        working-directory: frontend
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos .

      - name: Set version
        id: version
        env:
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GIT_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=dev-${GIT_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build macOS DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          retention-days: 7

  # Windows builds are moved to a separate workflow: build-windows.yml
  # This allows independent execution and better CI/CD organization

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            frontend/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get

      - name: Enable Linux desktop
        working-directory: frontend
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .

      - name: Set version
        id: version
        env:
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GIT_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=dev-${GIT_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Linux packages
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          ARCH: ${{ matrix.arch }}
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-tar
          path: dist/*.tar.gz
          retention-days: 7

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('dist/*.deb') != ''
        with:
          name: linux-${{ matrix.arch }}-deb
          path: dist/*.deb
          retention-days: 7

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            frontend/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get

      - name: Set version
        id: version
        env:
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GIT_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=dev-${GIT_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Flutter web
        working-directory: frontend
        run: flutter build web --release --no-tree-shake-icons --no-wasm-dry-run

      - name: Copy web files to embed directory
        run: |
          rm -rf cmd/network-debugger-web/_web
          mkdir -p cmd/network-debugger-web/_web
          cp -R frontend/build/web/* cmd/network-debugger-web/_web/

      - name: Build Go binaries with embedded web
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist

          echo "Building for darwin/amd64..."
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" \
            -o dist/network-debugger-web_darwin_amd64 ./cmd/network-debugger-web

          echo "Building for darwin/arm64..."
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" \
            -o dist/network-debugger-web_darwin_arm64 ./cmd/network-debugger-web

          echo "Building for linux/amd64..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" \
            -o dist/network-debugger-web_linux_amd64 ./cmd/network-debugger-web

          echo "Building for linux/arm64..."
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" \
            -o dist/network-debugger-web_linux_arm64 ./cmd/network-debugger-web

          echo "Building for windows/amd64..."
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o dist/network-debugger-web_windows_amd64.exe ./cmd/network-debugger-web

          echo "Building for windows/arm64..."
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" \
            -o dist/network-debugger-web_windows_arm64.exe ./cmd/network-debugger-web

      - name: Create archives
        working-directory: dist
        run: |
          tar -czf network-debugger-web_darwin_amd64.tar.gz network-debugger-web_darwin_amd64
          tar -czf network-debugger-web_darwin_arm64.tar.gz network-debugger-web_darwin_arm64
          tar -czf network-debugger-web_linux_amd64.tar.gz network-debugger-web_linux_amd64
          tar -czf network-debugger-web_linux_arm64.tar.gz network-debugger-web_linux_arm64

          zip network-debugger-web_windows_amd64.zip network-debugger-web_windows_amd64.exe
          zip network-debugger-web_windows_arm64.zip network-debugger-web_windows_arm64.exe

          ls -lah *.tar.gz *.zip

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  # Windows desktop build - calls separate workflow
  build-windows:
    uses: ./.github/workflows/build-windows.yml

  # Release job - only runs on version tags
  release:
    needs: [build-macos, build-linux, build-web, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.deb" \) -exec cp {} release/ \;
          ls -lah release/

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          version = tag[1:] if tag.startswith("v") else tag
          
          changelog_path = pathlib.Path("CHANGELOG.md")
          text = changelog_path.read_text(encoding="utf-8")
          
          header_re = re.compile(rf"^## \[{re.escape(version)}\].*$", re.M)
          header_match = header_re.search(text)
          
          if header_match:
            section_start = header_match.start()
            next_header = re.search(r"^## \[", text[header_match.end():], re.M)
            section_end = header_match.end() + (next_header.start() if next_header else 0)
            changelog_section = text[section_start:section_end].strip()
          else:
            changelog_section = (
              f"## [{version}]\n\n"
              "- No matching section found in CHANGELOG.md."
            )
          
          base_url = f"https://github.com/{repo}/releases/download/{tag}"
          
          desktop_rows = [
            ("macOS (Apple Silicon)", f"NetworkDebugger-{version}-macos-arm64.dmg"),
            ("macOS (Intel)", f"NetworkDebugger-{version}-macos-x86_64.dmg"),
            ("Windows (x64)", f"NetworkDebugger-{version}-windows-amd64.zip"),
            ("Linux (deb, x64)", f"network-debugger_{version}_amd64.deb"),
            ("Linux (tar.gz, x64)", f"NetworkDebugger-{version}-linux-amd64.tar.gz"),
          ]

          web_rows = [
            ("Web server — macOS (Apple Silicon)", "network-debugger-web_darwin_arm64.tar.gz"),
            ("Web server — macOS (Intel)", "network-debugger-web_darwin_amd64.tar.gz"),
            ("Web server — Windows (x64)", "network-debugger-web_windows_amd64.zip"),
            ("Web server — Windows (arm64)", "network-debugger-web_windows_arm64.zip"),
            ("Web server — Linux (x64)", "network-debugger-web_linux_amd64.tar.gz"),
            ("Web server — Linux (arm64)", "network-debugger-web_linux_arm64.tar.gz"),
          ]
          
          desktop_table = [
            "| OS | Asset | Download |",
            "|---|---|---|",
          ]
          
          for os_name, filename in desktop_rows:
            desktop_table.append(
              f"| {os_name} | `{filename}` | [Download]({base_url}/{filename}) |"
            )

          web_table = [
            "| OS | Asset | Download |",
            "|---|---|---|",
          ]

          for os_name, filename in web_rows:
            web_table.append(
              f"| {os_name} | `{filename}` | [Download]({base_url}/{filename}) |"
            )
          
          release_notes = "\n".join(
            [
              changelog_section,
              "",
              "---",
              "",
              "## Download",
              "",
              "### Desktop app",
              "",
              *desktop_table,
              "",
              "### Web server (embedded UI)",
              "",
              "Quick start (fastest):",
              "",
              "```bash",
              "dart pub global activate network_debugger",
              "network_debugger",
              "```",
              "",
              *web_table,
              "",
            ]
          )
          
          pathlib.Path("release-notes.md").write_text(
            release_notes,
            encoding="utf-8",
          )
          print("Generated release-notes.md")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Summary job
  summary:
    needs: [build-macos, build-linux, build-web, build-windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Desktop Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| macOS Desktop | ${{ needs.build-macos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Desktop | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows Desktop | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web server binaries | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
